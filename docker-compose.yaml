version: "3.8"

services:
  # ---------------------------------------------------
  # Database: PostgreSQL com suporte GIS para posições
  # ---------------------------------------------------

  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: ifood_poc_postgres

    environment:
      POSTGRES_DB: ifood_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

    networks:
      - ifood_net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ifood_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------
  # Broker / Cache: Redis para Pub/Sub e GPS em tempo real
  # ---------------------------------------------------

  redis:
    image: redis:7-alpine
    container_name: ifood_poc_redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    networks:
      - ifood_net

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------
  # Go Backend API / WebSockets Server
  # ---------------------------------------------------

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ifood_poc_backend

    ports:
      - "8080:8080"

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: ifood_db
      REDIS_ADDR: redis:6379
      PORT: 8080

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - ifood_net

# ---------------------------------------------------
# Networks
# ---------------------------------------------------

networks:
  ifood_net:
    driver: bridge

# ---------------------------------------------------
# Volumes
# ---------------------------------------------------

volumes:
  postgres_data:
  redis_data:
